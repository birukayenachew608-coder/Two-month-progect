<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Details - JobLink Ethiopia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .job-details-hero {
      background: var(--bg-card, #ffffff);
      border-radius: 1.5rem;
      padding: 3rem;
      margin-bottom: 2rem;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      border: 1px solid var(--slate-200);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      width: 100%;
      position: relative;
      overflow: hidden;
    }

    .job-details-hero::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 6px;
      background: linear-gradient(90deg, var(--primary-500), var(--secondary-500));
    }

    .job-details-content {
      background: var(--bg-card, #ffffff);
      padding: 3rem;
      border-radius: 1.5rem;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      border: 1px solid var(--slate-200);
      margin-bottom: 4rem;
      width: 100%;
    }

    .job-meta-badges {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 2.5rem;
    }

    .job-meta-badges .badge {
      font-size: 0.875rem;
      padding: 0.25rem 0.5rem;
      border-radius: 2rem;
    }

    .job-desc-text {
      line-height: 1.85;
      color: var(--slate-600);
      font-size: 1.25rem;
      white-space: pre-wrap;
    }

    .job-actions {
      display: flex;
      gap: 1rem;
      width: 100%;
      border-top: 1px solid var(--slate-200);
      padding-top: 2rem;
      margin-top: auto;
    }

    .info-card {
      background: var(--slate-50);
      padding: 1.5rem;
      border-radius: 1rem;
      border: 1px solid var(--slate-200);
      flex: 1;
    }
  </style>
</head>

<body>
  <header class="header">
    <div class="container header-inner flex-between">
      <a href="index.html" class="logo-link">
        <div class="logo-box">JL</div>
        <span class="logo-text">JobLink <span class="text-primary">Ethiopia</span></span>
      </a>
      <nav class="nav-menu">
        <a href="index.html" class="nav-btn">Home</a>
        <a href="seeker.html" class="nav-btn">Job Seeker</a>
        <a href="employer.html" class="nav-btn">Employer</a>
      </nav>
      <div class="auth-actions">
        <button class="btn btn-icon-small btn-outline" data-action="toggle-theme" title="Toggle Dark Mode"
          style="border:none; background: transparent;">
          <svg style="width: 1.25rem; height: 1.25rem; stroke: var(--slate-600);" fill="none" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="page-content" style="max-width: 1000px; margin: 0 auto; padding: 4rem 1.5rem; width: 100%;">
    <div id="loading" class="text-center py-12">
      <p class="text-slate-500 text-lg">Loading job details...</p>
    </div>
    <div id="job-content" style="display: none; width: 100%;">
      <div class="job-details-hero">
        <div class="flex flex-col gap-2 mb-2 text-slate-800" style="font-size: 0.95rem;">
          <div>
            <span class="text-slate-500 font-semibold mr-2">Project Name:</span>
            <span id="j-title" class="font-medium">Job Title</span>
          </div>
          <div>
            <span class="text-slate-500 font-semibold mr-2">Company Name:</span>
            <span id="j-company" class="font-medium">Company Name</span>
          </div>
          <div>
            <span class="text-slate-500 font-semibold mr-2">job type:</span>
            <span id="j-type" class="font-medium">Full-time</span>
          </div>
          <div>
            <span class="text-slate-500 font-semibold mr-2">Location:</span>
            <span id="j-location" class="font-medium">Location</span>
          </div>
          <div>
            <span class="text-slate-500 font-semibold mr-2">Salary:</span>
            <span id="j-salary" class="font-medium">Salary</span>
          </div>
        </div>

        <div class="job-actions">
          <button id="btn-apply"
            class="btn btn-primary px-6 py-2 shadow-md hover:-translate-y-1 transition-transform">Apply Now</button>
          <button id="btn-save" class="btn btn-outline px-6 py-2 hover:bg-slate-50">Save Job</button>
        </div>
      </div>

      <div class="job-details-content">
        <h2 class="text-3xl font-bold text-slate-900 mb-8 pb-4 border-b border-slate-200">Job Description</h2>
        <div id="j-description" class="job-desc-text">
          Description goes here.
        </div>

        <div class="mt-12 pt-8 border-t border-slate-200">
          <h3 class="text-2xl font-bold text-slate-900 mb-6">Additional Information</h3>
          <div class="flex gap-6 flex-wrap">
            <div class="info-card">
              <span class="text-sm font-bold text-slate-400 uppercase tracking-wider block mb-2">Posted Date</span>
              <span id="j-posted" class="text-slate-800 font-semibold text-xl"></span>
            </div>
            <div class="info-card">
              <span class="text-sm font-bold text-slate-400 uppercase tracking-wider block mb-2">Deadline</span>
              <span id="j-deadline" class="text-slate-800 font-semibold text-xl"></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const jobId = urlParams.get('id');

      if (!jobId) {
        document.getElementById('loading').innerHTML = '<p class="text-red-500">Invalid job ID.</p>';
        return;
      }

      fetch(`/api/jobs/${jobId}`)
        .then(res => {
          if (!res.ok) throw new Error('Job not found');
          return res.json();
        })
        .then(job => {
          document.getElementById('loading').style.display = 'none';
          document.getElementById('job-content').style.display = 'block';

          document.getElementById('j-title').textContent = job.title;
          document.getElementById('j-company').textContent = job.company_name;
          document.getElementById('j-type').textContent = job.job_type || 'Full-time';
          document.getElementById('j-location').textContent = job.location;
          document.getElementById('j-salary').textContent = job.salary || 'Salary not specified';
          document.getElementById('j-description').textContent = job.description;
          document.getElementById('j-posted').textContent = new Date(job.created_at).toLocaleDateString();
          document.getElementById('j-deadline').textContent = new Date(job.deadline).toLocaleDateString();

          const btnApply = document.getElementById('btn-apply');
          btnApply.onclick = () => window.applyForJob(job.id);

          const btnSave = document.getElementById('btn-save');
          btnSave.onclick = () => window.saveJob(job.id);
        })
        .catch(err => {
          document.getElementById('loading').innerHTML = '<p class="text-red-500">Error loading job details. The job may have been removed.</p>';
        });
    });
  </script>
</body>

</html>
